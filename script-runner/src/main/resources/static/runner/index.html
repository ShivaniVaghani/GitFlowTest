<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Script Runner</title>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>

    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
            crossorigin="anonymous"
    />
</head>
<body>
<div class="container py-4">
    <h1>Available Scripts</h1>
    <ul id="script-list" class="list-group"></ul>
</div>

<div class="modal fade" id="paramModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="paramForm">
                <div class="modal-header">
                    <h5 class="modal-title" id="paramModalLabel"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modal-body"></div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Run</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS first (no integrity attribute) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

<!-- Then your runner logic -->
<script src="/runner/js/app.js"></script>
</body>
</html>
