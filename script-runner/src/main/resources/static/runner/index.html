<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8"/>
    <title>Script Runner</title>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <link href="/runner/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/runner/css/font/bootstrap-icons.css" rel="stylesheet"/>
    <script src="/runner/js/knockout-3.5.1.js"></script>
    <style>
        body { background: #f8fafc; }
        .modal-lg { max-width: 800px; }
    </style>
</head>
<body>
<div class="container py-5" data-bind="with: vm">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 fw-bold">Available Scripts</h1>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addModal">
            <i class="bi bi-plus-circle me-1"></i> Add Script
        </button>
    </div>

    <div data-bind="visible: scripts().length === 0" class="alert alert-warning text-center">
        <i class="bi bi-info-circle"></i> No scripts found.
    </div>

    <ul class="list-group shadow-sm" data-bind="foreach: scripts">
        <li class="list-group-item d-flex justify-content-between align-items-start flex-wrap gap-2">
            <div>
                <h6 class="mb-1" data-bind="text: description"></h6>
                <small class="text-muted" data-bind="text: name"></small>
            </div>
            <div class="btn-group">
                <button class="btn btn-sm btn-primary" style="margin-right: 5px;" data-bind="click: $parent.openRunModal">
                    <i class="bi bi-play-fill"></i> Execute
                </button>
                <button class="btn btn-sm btn-warning" style="margin-right: 5px;" data-bind="click: $parent.openEditModal">
                    <i class="bi bi-pencil-square"></i> Edit
                </button>
                <button class="btn btn-sm btn-outline-danger" data-bind="click: $parent.deleteScript">
                    <i class="bi bi-trash"></i> Delete
                </button>
            </div>
        </li>
    </ul>
</div>

<!-- Run Script Modal -->
<div class="modal fade" id="runModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content" data-bind="with: vm">
            <form data-bind="submit: executeScript">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-terminal"></i> Run <span data-bind="text: selected()?.name"></span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <!-- ko if: selected -->
                    <!-- ko foreach: selected().parameters -->
                    <div class="mb-3">
                        <label class="form-label" data-bind="text: description"></label>
                        <input class="form-control"
                               data-bind="attr: { name: name, required: required }, value: defaultValue"/>
                    </div>
                    <!-- /ko -->
                    <!-- /ko -->
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary" data-bind="disable: isRunning">
                        <span data-bind="visible: !isRunning()">Run</span>
                        <span data-bind="visible: isRunning">
                            <span class="spinner-border spinner-border-sm me-1"></span>Running...
                        </span>
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-bind="disable: isRunning">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Add Script Modal -->
<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content" data-bind="with: vm">
            <form id="addForm" data-bind="submit: addScript">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-upload"></i> Add New Script</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" data-bind="value: newScript.name" required/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Version</label>
                            <input type="number" class="form-control" data-bind="value: newScript.version" min="1"/>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea rows="2" class="form-control" data-bind="value: newScript.description"></textarea>
                        </div>
                        <div class="col-12 form-check form-switch">
                            <input class="form-check-input" type="checkbox" data-bind="checked: newScript.active"/>
                            <label class="form-check-label">Active</label>
                        </div>
                    </div>

                    <h5 class="mt-4">Parameters</h5>
                    <table class="table table-sm align-middle">
                        <thead>
                        <tr>
                            <th>Name</th><th>Description</th><th>Default</th><th>Required</th><th></th>
                        </tr>
                        </thead>
                        <tbody data-bind="foreach: newScript.parameters">
                        <tr>
                            <td><input class="form-control form-control-sm" data-bind="value: name" required/></td>
                            <td><input class="form-control form-control-sm" data-bind="value: description"/></td>
                            <td><input class="form-control form-control-sm" data-bind="value: defaultValue"/></td>
                            <td class="text-center">
                                <input type="checkbox" class="form-check-input" data-bind="checked: required"/>
                            </td>
                            <td>
                                <button type="button" class="btn btn-sm btn-outline-danger" data-bind="click: $parent.removeParam">
                                    <i class="bi bi-x-circle"></i>
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <button type="button" class="btn btn-outline-primary btn-sm" data-bind="click: addParam">
                        <i class="bi bi-plus-circle"></i> Add Parameter
                    </button>

                    <div class="mt-4">
                        <label class="form-label">Script File</label>
                        <input type="file" class="form-control" accept=".py" data-bind="event:{ change: fileChanged }" required/>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success" data-bind="disable: isSaving">
                        <span data-bind="visible: !isSaving()">Upload</span>
                        <span data-bind="visible: isSaving">
                            <span class="spinner-border spinner-border-sm me-1"></span>Saving...
                        </span>
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-bind="disable: isSaving">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Script Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content" data-bind="with: vm">
            <form id="editForm" data-bind="submit: updateScript">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-pencil-square"></i> Edit Script</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <!-- reuse similar structure as addModal -->
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" data-bind="value: editingScript.name" required/>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Version</label>
                            <input type="number" class="form-control" data-bind="value: editingScript.version" min="1"/>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea rows="2" class="form-control" data-bind="value: editingScript.description"></textarea>
                        </div>
                        <div class="col-12 form-check form-switch">
                            <input class="form-check-input" type="checkbox" data-bind="checked: editingScript.active"/>
                            <label class="form-check-label">Active</label>
                        </div>
                    </div>

                    <h5 class="mt-4">Parameters</h5>
                    <table class="table table-sm align-middle">
                        <thead>
                        <tr><th>Name</th><th>Description</th><th>Default</th><th>Required</th><th></th></tr>
                        </thead>
                        <tbody data-bind="foreach: editingScript.parameters">
                        <tr>
                            <td><input class="form-control form-control-sm" data-bind="value: name" required/></td>
                            <td><input class="form-control form-control-sm" data-bind="value: description"/></td>
                            <td><input class="form-control form-control-sm" data-bind="value: defaultValue"/></td>
                            <td class="text-center"><input type="checkbox" class="form-check-input" data-bind="checked: required"/></td>
                            <td>
                                <button type="button" class="btn btn-sm btn-outline-danger" data-bind="click: $parent.removeEditParam">
                                    <i class="bi bi-x-circle"></i>
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <button type="button" class="btn btn-outline-primary btn-sm" data-bind="click: addEditParam">
                        <i class="bi bi-plus-circle"></i> Add Parameter
                    </button>

                </div>

                <div class="modal-footer">
                    <button type="submit" class="btn btn-warning" data-bind="disable: isSaving">
                        <span data-bind="visible: !isSaving()">Update</span>
                        <span data-bind="visible: isSaving">
                            <span class="spinner-border spinner-border-sm me-1"></span>Saving...
                        </span>
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-bind="disable: isSaving">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="confirmDeleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content" data-bind="with: vm">
            <div class="modal-header">
                <h5 class="modal-title text-danger"><i class="bi bi-exclamation-triangle-fill"></i> Confirm Delete</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to delete the script <strong data-bind="text: selected()?.name"></strong>?
                This action cannot be undone.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" data-bind="click: confirmDeleteScript">
                    <i class="bi bi-trash"></i> Delete
                </button>
            </div>
        </div>
    </div>
</div>

<div class="position-fixed top-0 end-0 p-3" style="z-index: 1080">
    <div id="errorToast" class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" id="errorToastBody">
                <!-- Error message will be injected here -->
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>
<script src="/runner/js/app.js"></script>
<script src="/runner/js/bootstrap.bundle.min.js"></script>
</body>
</html>
